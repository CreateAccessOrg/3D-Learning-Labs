<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Learning Experiences</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg: #ffffff;
      --card-bg: #ffffff;
      --text-main: #1a202c;
      --text-muted: #718096;
      --accent-orange: #ff9022;
      --accent-yellow: #ffda22;
      --accent-green: #00aa00;
      --header-bg: #171e35;

      /* fluid chrome scale, matched to the lab so the corner controls line up
         at the same inset and size across both pages */
      --edge: clamp(12px, 2.5vmin, 28px);
      --logo-h: clamp(22px, 3.4vmin, 34px);
      --fs-ui: clamp(12px, 1.45vmin, 14.5px);
    }
    
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* corner chrome - same inset, sizing and hover feel as the lab's .home-btn
       and .logo-top-right, so moving between the two pages feels continuous */
    .back-btn {
      position: fixed;
      top: var(--edge);
      left: var(--edge);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: rgba(23, 30, 53, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #fff;
      text-decoration: none;
      font-family: 'Lexend', sans-serif;
      font-size: var(--fs-ui);
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .back-btn:hover {
      background: rgba(23, 30, 53, 0.95);
      border-color: var(--accent-orange);
      color: var(--accent-orange);
      transform: translateX(-4px);
    }

    .logo-top-right {
      position: fixed;
      top: var(--edge);
      right: var(--edge);
      z-index: 1000;
      height: var(--logo-h);
      width: auto;
      object-fit: contain;
      pointer-events: none;
      opacity: 0.9;
    }

    .container {
      max-width: 1200px;
      width: 100%;
      /* clear the fixed corner chrome before the title starts */
      padding: calc(var(--edge) + 4rem) 2rem 4rem;
    }

    .page-title {
      font-family: 'Lexend', sans-serif;
      font-size: 2.75rem;
      margin-bottom: 0.5rem;
      text-align: center;
      color: var(--accent-green);
    }

    .page-subtitle {
      text-align: center;
      color: var(--text-muted);
      margin-bottom: 3rem;
      font-size: 1.1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05), 0 10px 20px rgba(0, 0, 0, 0.05);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease, border-color 0.3s ease;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      position: relative;
      border: 1px solid rgba(0, 0, 0, 0.05);
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 20px rgba(0, 0, 0, 0.08), 0 20px 30px rgba(0, 0, 0, 0.1);
      border-color: var(--accent-orange);
    }

    .card-header {
      height: 190px;
      background: var(--header-bg);
      position: relative;
      overflow: hidden;
    }

    .card-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transition: transform 0.4s ease;
    }

    .card:hover .card-image {
      transform: scale(1.05);
    }

    .card-body {
      padding: 1.45rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .card-title {
      font-family: 'Lexend', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0.55rem;
      color: var(--text-main);
    }

    .card-desc {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 0;
      flex: 1;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 1rem;
    }

    .tag {
      padding: 4px 7px;
      color: var(--text-muted);
      background: #f4f5f2;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 600;
    }

    @media (max-width: 600px) {
      .container {
        padding: calc(var(--edge) + 3.5rem) 1rem 2.5rem;
      }

      .page-title {
        font-size: 2.1rem;
      }
    }
  </style>
</head>

<body>

  <a href="https://createaccess.org/microcourses-hub" target="_top" class="back-btn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="m15 18-6-6 6-6" />
    </svg>
    <span>Back</span>
  </a>

  <img src="assets/Logo.png" alt="CreateAccess Logo" class="logo-top-right">

  <div class="container">
    <h1 class="page-title">Interactive Labs</h1>
    <p class="page-subtitle">Select an experience to begin exploring 3D fundamentals.</p>

    <div class="grid">
      <a href="labs/navigate-and-transform/" class="card">
        <div class="card-header">
          <img class="card-image" src="assets/navigate-and-transform.png"
            alt="Gizmo standing on a grid floor inside the Navigate and Transform lab">
        </div>
        <div class="card-body">
          <h2 class="card-title">Navigate + Transform</h2>
          <p class="card-desc">Learn how to use 3D software.</p>
        </div>
      </a>
    </div>
  </div>
</body>

</html>
